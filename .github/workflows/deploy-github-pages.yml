name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Asset base must be / for vesa.co.in (custom domain at site root). Set explicitly here so
      # GitHub Environment / repository variables cannot override with /vesa-atelier/ (that breaks
      # custom domains). For default https://<user>.github.io/<repo>/ previews, change the value
      # below to /vesa-atelier/ (with trailing slash) and redeploy.
      - name: Build static site
        env:
          GH_PAGES: "1"
          VITE_BASE_PATH: /
        run: npm run build

      - name: Verify HTML does not use repo subpath (custom domain)
        run: |
          if grep -qF "/vesa-atelier/" dist/client/index.html; then
            echo "::error::index.html still references /vesa-atelier/ — Vite base was not /"
            exit 1
          fi

      - name: Add SPA fallback for client-side routing
        run: cp dist/client/index.html dist/client/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
